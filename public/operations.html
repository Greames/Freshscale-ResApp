<!doctype html>
<html lang="en-IN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#c2410c">
  <title>Operations Hub · Freshscale ResApp</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="ops-shell">
    <header class="ops-header">
      <a class="brand ops-brand" id="back-dashboard" href="index.html#/dashboard">
        <span class="logo">R</span><span><strong>Freshscale ResApp</strong><small>Restaurant ERP</small></span>
      </a>
      <div class="ops-heading"><h1>Operations Hub</h1><p>Tasks, food safety, waste control and kitchen planning</p></div>
      <button id="ops-logout" class="btn" type="button">Sign out</button>
      <div class="ops-filters">
        <label>Outlet<select id="outlet"><option>Loading…</option></select></label>
        <label>From<input id="from" type="date"></label>
        <label>To<input id="to" type="date"></label>
      </div>
    </header>
    <nav class="ops-tabs" aria-label="Operations modules">
      <button class="btn active" data-ops-tab="tasks" role="tab">Tasks</button>
      <button class="btn" data-ops-tab="checklists" role="tab">Checklists</button>
      <button class="btn" data-ops-tab="waste" role="tab">Waste log</button>
      <button class="btn" data-ops-tab="production" role="tab">Kitchen production</button>
      <button class="btn" data-ops-tab="staff-meals" role="tab">Staff meals</button>
      <button class="btn" data-ops-tab="budgets" role="tab">Budgets</button>
      <button class="btn" data-ops-tab="users" role="tab" hidden>Team access</button>
    </nav>
    <main id="ops-view" class="view ops-view" aria-live="polite"><section class="card empty">Loading Freshscale ResApp operations…</section></main>
  </div>
  <div id="ops-toast" class="toast" role="status" hidden></div>
  <script src="operations.js"></script>
</body>
</html>
