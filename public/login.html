<!doctype html>
<html lang="en-IN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#c2410c">
  <title>Sign in · ResApp</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-page">
  <main class="auth-wrap">
    <a class="brand auth-brand" href="index.html"><span class="logo">R</span><span><strong>ResApp</strong><small>Restaurant Operations</small></span></a>
    <section class="card auth-card">
      <div class="auth-heading"><h1 id="auth-title">Sign in</h1><p id="auth-description">Sign in to manage your restaurant operations.</p></div>
      <div id="auth-error" class="auth-error" role="alert" hidden></div>
      <form id="auth-form" class="auth-form">
        <label class="op-field" id="name-field" hidden><span>Full name</span><input name="name" autocomplete="name"></label>
        <label class="op-field"><span>Email</span><input name="email" type="email" autocomplete="username" required></label>
        <label class="op-field"><span>Password</span><input name="password" type="password" autocomplete="current-password" minlength="12" required></label>
        <label class="op-field" id="confirm-field" hidden><span>Confirm password</span><input name="confirm_password" type="password" autocomplete="new-password" minlength="12"></label>
        <button id="auth-submit" class="btn primary auth-submit" type="submit">Sign in</button>
      </form>
      <p class="auth-footnote" id="auth-footnote">Access is limited to authorized ResApp users.</p>
    </section>
  </main>
  <script src="login.js"></script>
</body>
</html>
