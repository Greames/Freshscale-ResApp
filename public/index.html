<script>
const seed={menu:[{id:1,name:"Masala Dosa",cat:"South Indian",price:90,emoji:"🥞",desc:"Crisp dosa · potato masala",recipe:[["Rice & dal batter",.25],["Potato",.12]]},{id:2,name:"Ghee Podi Idli",cat:"South Indian",price:80,emoji:"🥘",desc:"Soft idli · ghee podi",recipe:[["Idli batter",.2],["Ghee",.015]]},{id:3,name:"Paneer Tikka Bowl",cat:"Mains",price:210,emoji:"🍲",desc:"Tandoor paneer · fresh salad",recipe:[["Paneer",.18],["Curd",.06]]},{id:4,name:"Veg Biryani",cat:"Mains",price:180,emoji:"🍛",desc:"Dum rice · house spices",recipe:[["Basmati rice",.22],["Mixed vegetables",.15]]},{id:5,name:"Filter Coffee",cat:"Beverages",price:45,emoji:"☕",desc:"Strong South Indian filter",recipe:[["Coffee decoction",.04],["Milk",.1]]},{id:6,name:"Fresh Lime Soda",cat:"Beverages",price:60,emoji:"🍋",desc:"Sweet or salted · chilled",recipe:[["Lime",1],["Soda",.2]]},{id:7,name:"Chicken 65",cat:"Starters",price:190,emoji:"🍗",desc:"Spiced · curry leaves",recipe:[["Chicken",.2],["Oil",.03]]},{id:8,name:"Gulab Jamun",cat:"Desserts",price:70,emoji:"🍮",desc:"Warm syrup · two pieces",recipe:[["Gulab jamun",2]]}],stock:[["Basmati rice","kg",18,10,95],["Rice & dal batter","kg",8,5,60],["Potato","kg",3.2,5,32],["Paneer","kg",2.4,3,320],["Milk","L",12,6,58],["Chicken","kg",4.5,4,230],["Mixed vegetables","kg",6,4,75],["Oil","L",5,3,145],["Ghee","L",1.8,2,580],["Curd","kg",4,2,70],["Coffee decoction","L",2,1,180],["Lime","pcs",16,10,4],["Soda","L",7,3,30],["Gulab jamun","pcs",32,12,12]].map((s,i)=>({id:i+1,name:s[0],unit:s[1],qty:s[2],min:s[3],cost:s[4]})),tables:Array.from({length:8},(_,i)=>({id:i+1,name:"T0"+(i+1),seats:i===4?6:4,status:[ "occupied","available","occupied","reserved","available","available","occupied","available"][i],guests:[2,0,3,0,0,0,2,0][i]})),orders:[{id:"FS-1048",type:"Dine in",table:"T03",items:[{id:4,qty:1},{id:5,qty:2}],total:270,status:"Preparing",created:Date.now()-540000},{id:"FS-1049",type:"Takeaway",table:"Pickup",items:[{id:1,qty:2},{id:6,qty:1}],total:240,status:"New",created:Date.now()-240000},{id:"FS-1050",type:"Dine in",table:"T07",items:[{id:7,qty:1},{id:5,qty:1}],total:235,status:"Ready",created:Date.now()-960000}],sales:[{id:"FS-1045",amount:680,channel:"Dine in",time:"10:42",status:"Paid"},{id:"FS-1046",amount:450,channel:"Takeaway",time:"10:51",status:"Paid"},{id:"FS-1047",amount:890,channel:"Delivery",time:"11:02",status:"Paid"}],purchases:[{id:"PO-208",supplier:"Sri Lakshmi Foods",items:"Rice, batter & pantry",amount:6800,status:"Awaiting approval"},{id:"PO-207",supplier:"Fresh Farm Supply",items:"Vegetables & lime",amount:2450,status:"Received"}],staff:[{name:"Anjali R.",role:"Kitchen lead",shift:"07:00–16:00",status:"On shift"},{name:"Kiran M.",role:"Service captain",shift:"09:00–18:00",status:"On shift"},{name:"Sandeep P.",role:"Chef",shift:"11:00–20:00",status:"Upcoming"},{name:"Divya K.",role:"Cashier",shift:"12:00–21:00",status:"Upcoming"}]};
let db;try{db=JSON.parse(localStorage.getItem("fs-resapp-clean-v1"))||structuredClone(seed)}catch{db=structuredClone(seed)}let view="overview",cart=[],type="Dine in",table="T02",filter="All",search="";
const $=s=>document.querySelector(s),money=n=>new Intl.NumberFormat("en-IN",{style:"currency",currency:"INR",maximumFractionDigits:0}).format(n),save=()=>localStorage.setItem("fs-resapp-clean-v1",JSON.stringify(db)),sum=(a,f)=>a.reduce((v,x)=>v+f(x),0),openOrders=()=>db.orders.filter(o=>!["Paid","Cancelled"].includes(o.status)),sales=()=>sum(db.sales,s=>s.amount)+sum(openOrders(),o=>o.total);
function toast(s){let e=document.createElement("div");e.className="toast";e.textContent=s;$("#toasts").append(e);setTimeout(()=>e.remove(),2600)}
function head(k,t,p,buttons=""){return `<div class="heading"><div><div class="eyebrow">${k}</div><h1>${t}</h1><p>${p}</p></div><div class="actions">${buttons}</div></div>`}
function panel(t,p="",a=""){return `<div class="panelhead"><div><h2>${t}</h2>${p?`<p>${p}</p>`:""}</div>${a}</div>`}
function stat(t,v,ic,h){return `<div class="card"><div class="statline"><span>${t}</span><span class="staticon">${ic}</span></div><div class="value">${v}</div><div class="hint">${h}</div></div>`}
function badge(s){let c=/Ready|Paid|Received|On shift/.test(s)?"good":/Low|Out/.test(s)?"bad":/Preparing|Awaiting/.test(s)?"warn":"";return `<span class="badge ${c}">${s}</span>`}
function tableRows(rows){return `<div class="tablewrap"><table><thead><tr>${rows[0].map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>${rows.slice(1).map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`}
function overview(){let low=db.stock.filter(s=>s.qty<s.min);let popular=db.menu.slice(0,4);return head("SERVICE SNAPSHOT","Good morning, team 👋","Your restaurant at a glance.",'<button class="btn" data-action="export">Export sales</button><button class="btn primary" data-view="pos">＋ New order</button>')+`<div class="grid4">${stat("Sales today",money(sales()),"₹",db.sales.length+openOrders().length+" demo transactions")}${stat("Open orders",openOrders().length,"↗",openOrders().filter(o=>o.status==="Preparing").length+" preparing")}${stat("Stock alerts",low.length,"▧","Ingredients below minimum")}${stat("Team on shift",db.staff.filter(s=>s.status==="On shift").length,"♙","Sample roster")}</div><div class="two"><section class="panel">${panel("Sales activity","Illustrative hourly trend")}<div class="chart">${[35,54,43,75,51,86,67,57,93,71,79,62].map((v,i)=>`<div class="barcol"><div class="bar" style="height:${v*.65}%"></div><div class="bar today" style="height:${v}%"></div><small>${["8a","9a","10a","11a","12p","1p","2p","3p","4p","5p","6p","7p"][i]}</small></div>`).join("")}</div><p class="hint">Chart values are illustrative, not connected to live sales.</p></section><section class="panel">${panel("Popular menu items","Current catalogue")}<div class="list">${popular.map(m=>`<div class="rank"><div class="emoji">${m.emoji}</div><div><strong>${m.name}</strong><small>${m.cat}</small></div><div class="amount">${money(m.price)}<small>per item</small></div></div>`).join("")}</div></section></div><div class="two"><section class="panel">${panel("Live order queue","Service status",'<button class="btn" data-view="kitchen">Kitchen ↗</button>')}${tableRows([["ORDER","CHANNEL","TOTAL","STATUS"],...openOrders().map(o=>[o.id,o.type,money(o.total),badge(o.status)])])}</section><section class="panel">${panel("Needs attention","Operational reminders")}<div class="list">${low.slice(0,3).map(s=>`<div class="rank"><div class="emoji">!</div><div><strong>${s.name} running low</strong><small>${s.qty} ${s.unit} left · min ${s.min}</small></div></div>`).join("")||"No low-stock ingredients"}<div class="rank"><div class="emoji">⇄</div><div><strong>Purchasing follow-up</strong><small>${db.purchases.filter(p=>p.status!=="Received").length} purchase order(s) need attention.</small></div></div></div></section></div>`}
function pos(){let items=db.menu.filter(m=>(filter==="All"||m.cat===filter)&&m.name.toLowerCase().includes(search.toLowerCase()));let sub=sum(cart,c=>db.menu.find(m=>m.id===c.id).price*c.qty),tax=Math.round(sub*.05);return head("FRONT OF HOUSE","Point of sale","Create a ticket and send it to the kitchen.",'<button class="btn" data-view="tables">▤ Floor plan</button>')+`<div class="tabs">${["All","South Indian","Starters","Mains","Beverages","Desserts"].map(f=>`<button class="${filter===f?"active":""}" data-filter="${f}">${f}</button>`).join("")}</div><div class="workspace"><section><div class="toolbar"><input class="field" id="search" placeholder="Search menu…" value="${search}"><select class="filter" id="type"><option>Dine in</option><option ${type==="Takeaway"?"selected":""}>Takeaway</option><option ${type==="Delivery"?"selected":""}>Delivery</option></select><select class="filter" id="table" ${type!=="Dine in"?"disabled":""}>${db.tables.map(t=>`<option ${table===t.name?"selected":""}>${t.name}</option>`).join("")}</select></div><div class="menu-grid">${items.map(m=>`<article class="menu-item"><div class="emoji">${m.emoji}</div><strong>${m.name}</strong><p>${m.desc}</p><div class="menubottom"><b>${money(m.price)}</b><button class="add" data-add="${m.id}">＋</button></div></article>`).join("")||'<div class="empty">No matching menu items.</div>'}</div></section><aside class="panel cart">${panel("Current ticket",type+" · "+(type==="Dine in"?table:type==="Takeaway"?"Pickup":"Delivery"),'<button class="btn" data-action="clear">Clear</button>')}${cart.map(c=>{let m=db.menu.find(x=>x.id===c.id);return `<div class="cartline"><div><strong>${m.name}</strong><small>${money(m.price)} each</small></div><div class="qty"><button data-qty="-1" data-id="${m.id}">−</button>${c.qty}<button data-qty="1" data-id="${m.id}">＋</button></div><b>${money(m.price*c.qty)}</b></div>`}).join("")||'<div class="empty">Tap a menu item to add it.</div>'}<div class="totalrow"><span>Subtotal</span><b>${money(sub)}</b></div><div class="totalrow"><span>Estimated tax (5% demo)</span><b>${money(tax)}</b></div><div class="totalrow big"><span>Total</span><span>${money(sub+tax)}</span></div><button class="btn primary full" data-action="send" ${cart.length?"":"disabled"}>Send to kitchen →</button><p class="hint">Demo only: no payment is collected.</p></aside></div>`}
function kitchen(){let groups=["New","Preparing","Ready"];return head("BACK OF HOUSE","Kitchen display","Move each ticket through preparation and service.",'<button class="btn" data-action="refresh">↻ Refresh</button>')+`<div class="grid4">${stat("New",db.orders.filter(o=>o.status==="New").length,"＋","Waiting to start")}${stat("Preparing",db.orders.filter(o=>o.status==="Preparing").length,"♨","In progress")}${stat("Ready",db.orders.filter(o=>o.status==="Ready").length,"✓","Awaiting pickup")}${stat("Target time","12 min","◷","Illustrative service goal")}</div><div class="kitchen">${groups.map(g=>{let os=db.orders.filter(o=>o.status===g);return `<section class="kcol"><div class="khead">${g}<span>${os.length}</span></div>${os.map(o=>`<article class="ticket"><div class="tickethead">${o.id} · ${o.table}<span class="muted">${Math.max(1,Math.round((Date.now()-o.created)/60000))}m</span></div><ul>${o.items.map(i=>`<li>${i.qty} × ${db.menu.find(m=>m.id===i.id)?.name||"Menu item"}</li>`).join("")}</ul><button class="btn ${g!=="Ready"?"primary":""}" data-status="${g==="New"?"Preparing":g==="Preparing"?"Ready":"Paid"}" data-id="${o.id}">${g==="New"?"Start preparation →":g==="Preparing"?"Mark ready ✓":"Complete order ✓"}</button></article>`).join("")||'<div class="empty">No tickets</div>'}</section>`}).join("")}</div>`}
function tables(){return head("FRONT OF HOUSE","Floor & tables","Select an available table to start an order; occupied tables can be released.",'<button class="btn primary" data-view="pos">＋ New order</button>')+`<div class="grid4">${stat("Tables",db.tables.length,"▤","Configured")}${stat("Available",db.tables.filter(t=>t.status==="available").length,"✓","Ready for guests")}${stat("Occupied",db.tables.filter(t=>t.status==="occupied").length,"◉","Currently seated")}${stat("Reserved",db.tables.filter(t=>t.status==="reserved").length,"◷","Expected guests")}</div><section class="panel">${panel("Main dining room","Simple table map · click a table to update its state")}<div class="floor">${db.tables.map(t=>`<button class="tablebtn ${t.status}" data-table="${t.name}"><div class="shape">${t.name.slice(1)}</div><strong>${t.name}</strong><small>${t.seats} seats · ${t.status}</small></button>`).join("")}</div></section>`}
function menuView(){return head("CATALOGUE","Menu & recipes","Maintain the menu catalogue and recipe coverage.",'<button class="btn primary" data-action="add-menu">＋ Add menu item</button>')+`<div class="grid4">${stat("Menu items",db.menu.length,"☷","In catalogue")}${stat("Categories",new Set(db.menu.map(m=>m.cat)).size,"▦","Menu groups")}${stat("Recipe coverage",db.menu.filter(m=>m.recipe?.length).length+"/"+db.menu.length,"⌁","Items with ingredient mapping")}${stat("Popular items",db.menu.slice(0,4).length,"★","Sample best sellers")}</div><div class="toolbar"><input class="field" id="search" placeholder="Search menu…" value="${search}"><select class="filter" id="catfilter"><option>All categories</option>${[...new Set(db.menu.map(m=>m.cat))].map(c=>`<option ${filter===c?"selected":""}>${c}</option>`).join("")}</select></div><section class="panel">${panel("Menu catalogue","Selling price and recipe setup status")}${tableRows([["ITEM","CATEGORY","PRICE","RECIPE","TYPE","ACTION"],...db.menu.filter(m=>(!search||m.name.toLowerCase().includes(search.toLowerCase()))&&(filter==="All"||m.cat===filter)).map(m=>[`${m.emoji}　<strong>${m.name}</strong>`,m.cat,money(m.price),(m.recipe||[]).length+" ingredients",badge(m.recipe?.length?"Recipe mapped":"Recipe needed"),`<button class="btn" data-edit="${m.id}">Edit</button>`])])}</section>`}
function inventory(){return head("SUPPLY & COST CONTROL","Inventory","Monitor ingredient quantities, reorder thresholds, and indicative value.",'<button class="btn" data-action="adjust">＋ Adjust stock</button><button class="btn primary" data-view="purchasing">Purchase order</button>')+`<div class="grid4">${stat("Ingredients",db.stock.length,"▧","Tracked stock lines")}${stat("Low stock",db.stock.filter(s=>s.qty<s.min).length,"!","Below minimum")}${stat("Stock value",money(sum(db.stock,s=>s.qty*s.cost)),"₹","Indicative sample value")}${stat("Open POs",db.purchases.filter(p=>p.status!=="Received").length,"⇄","Awaiting receipt")}</div><div class="toolbar"><input class="field" id="search" placeholder="Search ingredients…" value="${search}"><select class="filter" id="catfilter"><option>All stock</option><option ${filter==="Low stock"?"selected":""}>Low stock</option></select></div><section class="panel">${panel("Ingredient balances","Unit costs are sample values")}${tableRows([["INGREDIENT","ON HAND","MINIMUM","LEVEL","UNIT COST","STATUS"],...db.stock.filter(s=>(!search||s.name.toLowerCase().includes(search.toLowerCase()))&&(filter!=="Low stock"||s.qty<s.min)).map(s=>[s.name,s.qty+" "+s.unit,s.min+" "+s.unit,`<div class="stockbar"><span style="width:${Math.min(100,s.qty/Math.max(1,s.min*2)*100)}%;background:${s.qty<s.min?"#b84b40":"#216b4a"}"></span></div>`,money(s.cost)+"/"+s.unit,badge(s.qty<s.min?"Low stock":"In stock")])])}</section>`}
function purchasing(){return head("SUPPLY CHAIN","Purchasing","Manage sample supplier orders and receiving.",'<button class="btn primary" data-action="new-po">＋ Create purchase order</button>')+`<div class="grid4">${stat("Purchase orders",db.purchases.length,"⇄","Sample register")}${stat("Awaiting approval",db.purchases.filter(p=>p.status==="Awaiting approval").length,"◷","Needs review")}${stat("Received",db.purchases.filter(p=>p.status==="Received").length,"✓","Marked received")}${stat("Open value",money(sum(db.purchases.filter(p=>p.status!=="Received"),p=>p.amount)),"₹","Pending PO value")}</div><section class="panel">${panel("Purchase order register","Receiving is a demo state transition")}${tableRows([["REFERENCE","SUPPLIER","ITEMS","AMOUNT","STATUS","ACTION"],...db.purchases.map(p=>[p.id,p.supplier,p.items,money(p.amount),badge(p.status),p.status==="Received"?"—":`<button class="btn" data-receive="${p.id}">Mark received</button>`])])}</section>`}
function team(){return head("TEAM OPERATIONS","People & shifts","View the sample roster and shift coverage.",'<button class="btn primary" data-action="add-staff">＋ Add team member</button>')+`<div class="grid4">${stat("Team members",db.staff.length,"♙","Sample roster")}${stat("On shift",db.staff.filter(s=>s.status==="On shift").length,"✓","Currently scheduled")}${stat("Upcoming",db.staff.filter(s=>s.status==="Upcoming").length,"◷","Later shifts")}${stat("Coverage","Demo","▥","Scheduling is not live")}</div><section class="panel">${panel("Today's roster","Sample shifts · not connected to attendance")}${tableRows([["TEAM MEMBER","ROLE","SHIFT","STATUS","ACTION"],...db.staff.map((s,i)=>[s.name,s.role,s.shift,badge(s.status),`<button class="btn" data-staff="${i}">${s.status==="On shift"?"Clock out":"Clock in"}</button>`])])}</section>`}
function reports(){let total=sales(),cost=Math.round(total*.31);return head("BUSINESS INTELLIGENCE","Reports & insights","Sales and margin overview from sample records.",'<button class="btn primary" data-action="export">↧ Export CSV</button>')+`<div class="grid4">${stat("Gross sales",money(total),"₹","Demo transactions")}${stat("Estimated food cost",money(cost),"▧","31% sample assumption")}${stat("Gross margin",money(total-cost),"↗","Before labour/overheads")}${stat("Tax estimate",money(Math.round(total*.05)),"▤","Not a GST invoice")}</div><div class="two"><section class="panel">${panel("Sales by channel","Sample completed and open orders")}<div class="list">${["Dine in","Takeaway","Delivery"].map(c=>{let n=sum(db.sales.filter(s=>s.channel===c),s=>s.amount)+sum(db.orders.filter(o=>o.type===c),o=>o.total);return `<div><div class="statline"><span>${c}</span><b>${money(n)}</b></div><div class="stockbar" style="margin-top:8px"><span style="width:${Math.min(100,n/Math.max(1,total)*100)}%"></span></div></div>`}).join("")}</div></section><section class="panel">${panel("Menu mix","Items by category")}<div class="list">${[...new Set(db.menu.map(m=>m.cat))].map(c=>`<div class="statline"><span>${c}</span><b>${db.menu.filter(m=>m.cat===c).length} items</b></div>`).join("")}</div></section></div><section class="panel">${panel("Sales ledger","Sample transactions")}${tableRows([["REFERENCE","CHANNEL","TIME","AMOUNT","STATUS"],...db.sales.map(s=>[s.id,s.channel,s.time,money(s.amount),badge(s.status)])])}</section>`}
function settings(){return head("ADMINISTRATION","Workspace settings","Prototype status and data controls.")+`<div class="two"><section class="panel">${panel("Restaurant profile")}<p class="hint">Workspace: Freshscale Proddatur · Main outlet</p><hr style="border:0;border-top:1px solid var(--line)"><p class="hint">Currency: Indian Rupee (INR)</p><p class="hint">Taxes are demo estimates only.</p></section><section class="panel">${panel("Prototype limitations")}<p>Browser-local data only; no server-side database.</p><p>No user authentication or outlet isolation.</p><p>No live payment gateway or GST invoice generation.</p><button class="btn" data-action="reset">Reset demo data</button></section></div>`}
const views={overview,pos,kitchen,tables,menu:menuView,inventory,purchasing,team,reports,settings};
function render(){ $("#crumb").textContent=({overview:"Overview",pos:"Point of sale",kitchen:"Kitchen display",tables:"Floor & tables",menu:"Menu & recipes",inventory:"Inventory",purchasing:"Purchasing",team:"People & shifts",reports:"Reports",settings:"Workspace settings"})[view];document.querySelectorAll("[data-view]").forEach(b=>b.classList.toggle("active",b.dataset.view===view));$("#content").innerHTML=views[view]();bind()}
function go(v){view=v;search="";if(v==="pos")filter="All";$("#side").classList.remove("open");render();window.scrollTo(0,0)}
function modal(title,text,yes){let d=$("#modal");d.innerHTML=`<h2>${title}</h2><p>${text}</p><div class="actions" style="justify-content:flex-end"><button class="btn" data-close>Cancel</button><button class="btn primary" data-yes>Confirm</button></div>`;d.querySelector("[data-close]").onclick=()=>d.close();d.querySelector("[data-yes]").onclick=()=>{d.close();yes()};d.showModal()}
function bind(){ $("#content").querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>go(b.dataset.view));$("#content").querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});$("#content").querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{let id=+b.dataset.add,line=cart.find(c=>c.id===id);line?line.qty++:cart.push({id,qty:1});render()});$("#content").querySelectorAll("[data-qty]").forEach(b=>b.onclick=()=>{let c=cart.find(c=>c.id===+b.dataset.id);c.qty+=+b.dataset.qty;if(c.qty<1)cart=cart.filter(x=>x!==c);render()});let q=$("#search");if(q)q.oninput=e=>{let pos=e.target.selectionStart;search=e.target.value;render();$("#search")?.focus();$("#search")?.setSelectionRange(pos,pos)};let t=$("#type");if(t)t.onchange=e=>{type=e.target.value;render()};let tb=$("#table");if(tb)tb.onchange=e=>{table=e.target.value;render()};let cf=$("#catfilter");if(cf)cf.onchange=e=>{filter=cf.value==="All categories"||cf.value==="All stock"?"All":cf.value;render()};
$("#content").querySelectorAll("[data-status]").forEach(b=>b.onclick=()=>{let o=db.orders.find(o=>o.id===b.dataset.id);o.status=b.dataset.status;if(o.status==="Paid"){db.sales.unshift({id:o.id,amount:o.total,channel:o.type,time:new Date().toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"}),status:"Paid"});let t=db.tables.find(t=>t.name===o.table);if(t){t.status="available";t.guests=0}}save();toast(o.id+" · "+o.status);render()});
$("#content").querySelectorAll("[data-table]").forEach(b=>b.onclick=()=>{let t=db.tables.find(t=>t.name===b.dataset.table);if(t.status==="available"){table=t.name;type="Dine in";go("pos")}else modal("Update "+t.name,"This table is "+t.status+". Make it available?",()=>{t.status="available";t.guests=0;save();render()})});
$("#content").querySelectorAll("[data-receive]").forEach(b=>b.onclick=()=>{let p=db.purchases.find(p=>p.id===b.dataset.receive);p.status="Received";save();render();toast(p.id+" received")});$("#content").querySelectorAll("[data-staff]").forEach(b=>b.onclick=()=>{let s=db.staff[+b.dataset.staff];s.status=s.status==="On shift"?"Upcoming":"On shift";save();render();toast("Roster updated")});$("#content").querySelectorAll("[data-action]").forEach(b=>b.onclick=()=>act(b.dataset.action))}
function act(a){if(a==="clear"){cart=[];render()}if(a==="send"){let sub=sum(cart,c=>db.menu.find(m=>m.id===c.id).price*c.qty),id="FS-"+(1051+db.orders.length+db.sales.length);db.orders.unshift({id,type,table:type==="Dine in"?table:type==="Takeaway"?"Pickup":"Delivery",items:structuredClone(cart),total:sub+Math.round(sub*.05),status:"New",created:Date.now()});if(type==="Dine in"){let t=db.tables.find(t=>t.name===table);if(t){t.status="occupied";t.guests=Math.max(1,t.guests)}}cart=[];save();toast("Order sent to kitchen · "+id);go("kitchen")}if(a==="refresh"){render();toast("Queue refreshed")}if(a==="new-po")modal("Create purchase order","Create a sample purchase order; no supplier will be contacted.",()=>{db.purchases.unshift({id:"PO-"+(209+db.purchases.length),supplier:"New supplier",items:"Items to confirm",amount:0,status:"Awaiting approval"});save();render()});if(a==="adjust")modal("Adjust inventory","Add one unit to the first stock item as a sample adjustment.",()=>{db.stock[0].qty++;save();render();toast("Sample stock updated")});if(a==="add-staff")modal("Add team member","Add a sample team member to the roster.",()=>{db.staff.push({name:"New team member",role:"Service staff",shift:"12:00–21:00",status:"Upcoming"});save();render()});if(a==="add-menu")menuModal();if(a==="reset")modal("Reset demo data","Discard local changes and restore sample records?",()=>{db=structuredClone(seed);cart=[];save();render();toast("Demo data reset")});if(a==="export"){let rows=[["Reference","Channel","Amount","Status"],...db.sales.map(s=>[s.id,s.channel,s.amount,s.status])],csv=rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(",")).join("\n"),url=URL.createObjectURL(new Blob([csv],{type:"text/csv"})),a=document.createElement("a");a.href=url;a.download="freshscale-demo-sales.csv";a.click();URL.revokeObjectURL(url);toast("Sales CSV exported")}}
function menuModal(m){let d=$("#modal"),isNew=!m;m=m||{name:"",cat:"Mains",price:0};d.innerHTML=`<h2>${isNew?"Add menu item":"Edit menu item"}</h2><p>Update the demo menu catalogue.</p><label class="hint">Item name</label><input class="field" id="mn" value="${m.name}"><label class="hint">Category</label><select class="field" id="mc"><option>South Indian</option><option>Starters</option><option>Mains</option><option>Beverages</option><option>Desserts</option></select><label class="hint">Price (₹)</label><input class="field" id="mp" type="number" min="0" value="${m.price}"><div class="actions" style="justify-content:flex-end"><button class="btn" data-close>Cancel</button><button class="btn primary" data-save>Save item</button></div>`;d.querySelector("#mc").value=m.cat;d.querySelector("[data-close]").onclick=()=>d.close();d.querySelector("[data-save]").onclick=()=>{let name=d.querySelector("#mn").value.trim(),price=+d.querySelector("#mp").value;if(!name||!Number.isFinite(price)||price<0){toast("Enter a valid name and price");return}if(isNew)db.menu.push({id:Math.max(0,...db.menu.map(x=>x.id))+1,name,cat:d.querySelector("#mc").value,price,emoji:"🍽️",desc:"New menu item",recipe:[]});else{let x=db.menu.find(x=>x.id===m.id);x.name=name;x.cat=d.querySelector("#mc").value;x.price=price}save();d.close();render();toast("Menu saved")};d.showModal()}
$("#nav").onclick=e=>{let b=e.target.closest("[data-view]");if(b)go(b.dataset.view)};$("#mobile").onclick=()=>$("#side").classList.toggle("open");render();
</script></body></html>
